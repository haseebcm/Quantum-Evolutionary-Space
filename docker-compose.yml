version: "3.9"

# Local, single-node reference deployment of the QES production runtime.
# Scale `worker` horizontally with `docker compose up --scale worker=3`
# for trusted single-host work with atomic SQLite claims on the same local
# volume. Do not use this SQLite database across network-mounted filesystems.
services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: qes-runtime:latest
    environment:
      QES_LOG_LEVEL: INFO
      QES_RUNTIME_STATE_DIR: /app/state
      QES_WORKER_CYCLES: "0"
      QES_WORKER_INTERVAL_SECONDS: "10"
    command: ["--task-queue", "/app/state/tasks.sqlite"]
    volumes:
      - qes-runtime-state:/app/state
    restart: unless-stopped
    stop_grace_period: 60s
    cpus: 1.0
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp

volumes:
  qes-runtime-state:
