version: "3.9"

# Local, single-node reference deployment of the QES production runtime.
# Scale `worker` horizontally with `docker compose up --scale worker=3`
# once the entrypoint reads jobs from a shared queue instead of the demo
# workload; for now each replica runs its own in-container scheduler
# against a shared SQLite volume for durable job history.
services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: qes-runtime:latest
    environment:
      QES_LOG_LEVEL: INFO
      QES_RUNTIME_STATE_DIR: /app/state
      QES_WORKER_CYCLES: "0"
      QES_WORKER_INTERVAL_SECONDS: "10"
    command: ["--worker-count", "4"]
    volumes:
      - qes-runtime-state:/app/state
    restart: unless-stopped

volumes:
  qes-runtime-state:
