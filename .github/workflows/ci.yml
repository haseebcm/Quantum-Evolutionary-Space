name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests examples

      - name: Type check (mypy)
        run: mypy

      - name: Test with coverage
        run: pytest -q --cov=qes --cov-report=term-missing

      - name: Run all shipped examples
        run: |
          for example in examples/*.py; do
            timeout 60s python "$example"
          done

  installed-wheel:
    name: Validate installed wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl pytest scipy
      - name: Test installed distribution outside source import path
        run: |
          python -m pytest -q
          cd "$(mktemp -d)"
          python -c "import importlib.metadata, qes, qes.quantum_compute; from importlib.resources import files; assert importlib.metadata.version('qes') == qes.__version__ == qes.quantum_compute.__version__; assert files('qes').joinpath('py.typed').is_file()"
          qes-worker --cycles 1 --interval 0

  benchmark:
    name: Benchmark regression gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run benchmarks against committed baseline
        run: |
          python benchmarks/run_benchmarks.py \
            --repeat 5 \
            --baseline benchmarks/qes_benchmarks.json \
            --json benchmarks/qes_benchmarks_latest.json \
            --fail-on-regression

      - name: Upload benchmark results (historical trend artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qes-benchmarks-${{ github.run_id }}
          path: benchmarks/qes_benchmarks_latest.json
          retention-days: 90
