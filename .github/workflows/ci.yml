name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests examples

      - name: Type check (mypy)
        run: mypy

      - name: Test with coverage
        run: pytest -q --cov=qes --cov-report=term-missing

      - name: Run examples
        run: |
          python examples/basic_run.py
          python examples/control_policy_search.py
          python examples/design_space_search.py
          python examples/intelligent_universe.py
          python examples/scipy_baseline_benchmark.py

  benchmark:
    name: Benchmark regression gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run benchmarks against committed baseline
        run: |
          python benchmarks/run_benchmarks.py \
            --repeat 5 \
            --baseline benchmarks/qes_benchmarks.json \
            --json benchmarks/qes_benchmarks_latest.json \
            --fail-on-regression

      - name: Upload benchmark results (historical trend artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qes-benchmarks-${{ github.run_id }}
          path: benchmarks/qes_benchmarks_latest.json
          retention-days: 90
