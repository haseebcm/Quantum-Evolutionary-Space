name: Publish to PyPI

# Builds and publishes the qes package to PyPI whenever a version tag
# (e.g. v0.4.0) is pushed. Uses PyPI's trusted publishing (OIDC) so no
# long-lived API token needs to be stored as a repository secret; configure
# the "pypi" environment as a trusted publisher for this repo on PyPI
# before the first release: https://docs.pypi.org/trusted-publishers/
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  single-host-operations:
    name: Single-host load and container recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python benchmarks/validate_single_host.py --tasks 40 --json native-operations.json
      - run: docker build -t qes-acceptance .
      - run: python benchmarks/validate_single_host.py --docker-image qes-acceptance --tasks 40 --json container-operations.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-host-operations-${{ github.run_id }}
          path: "*-operations.json"

  validate:
    name: Release checks (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests examples
      - run: mypy
      - run: pytest -q
      - name: Run shipped examples
        run: |
          for example in examples/*.py; do
            timeout 60s python "$example"
          done
      - name: Benchmark regression gate
        if: matrix.python == '3.12'
        run: python benchmarks/run_benchmarks.py --repeat 5 --baseline benchmarks/qes_benchmarks.json --fail-on-regression

  build:
    name: Build distribution
    needs: [validate, single-host-operations]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "import runpy; print(runpy.run_path('src/qes/_version.py')['__version__'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package source version ($PKG_VERSION)"
            exit 1
          fi

      - name: Run test suite before publishing
        run: |
          python -m pip install -e ".[dev]"
          pytest -q

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify installed wheel outside checkout
        run: |
          python -m pip uninstall -y qes
          python -m pip install dist/*.whl
          TASK_TEST_DIR=$(mktemp -d)
          cp -r tests "$TASK_TEST_DIR/tests"
          cd "$TASK_TEST_DIR"
          python -m pytest -q tests
          python -c "import importlib.metadata, qes; assert qes.__version__ == importlib.metadata.version('qes')"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qes-dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/qes
    permissions:
      id-token: write  # required for PyPI trusted publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: qes-dist
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
