[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qes"
dynamic = ["version"]
description = "QES — Quantum Evolutionary Space: a general-purpose framework for governed possibility-space computation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mohamed Haseeb C M" },
]
keywords = [
    "optimization",
    "search",
    "simulation",
    "digital-twin",
    "governed-search",
    "framework",
    "scheduling",
    "runtime",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
]

[project.scripts]
qes-worker = "qes.worker:main"

[project.urls]
Homepage = "https://github.com/haseebcm/Quantum-Evolutionary-Space"
Repository = "https://github.com/haseebcm/Quantum-Evolutionary-Space"
Documentation = "https://github.com/haseebcm/Quantum-Evolutionary-Space/blob/main/docs/QES-architecture.md"
Issues = "https://github.com/haseebcm/Quantum-Evolutionary-Space/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "scipy>=1.10",
]
redis = [
    "redis>=5.0",
]
postgres = [
    "psycopg2-binary>=2.9",
]
runtime = [
    "qes[redis,postgres]",
]

[tool.setuptools.dynamic]
version = { attr = "qes._version.__version__" }

[tool.setuptools.package-data]
qes = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["qes"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
check_untyped_defs = true
files = ["src/qes"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
